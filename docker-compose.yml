# Full digital-twin stack: broker, time-series store, dashboards, mapper.
#
#   docker compose up --build -d
#
# Then:
#   http://localhost:8080          live map
#   http://localhost:8080/compare  real room vs the robot's map
#   http://localhost:3000          Grafana  (admin / admin)
#   http://localhost:8086          InfluxDB (admin / roommapper123)
#
# The simulator runs inside the mapper by default, so this comes up with data
# flowing and no hardware attached. Set SOURCE=mqtt and run the robot agent on
# the host when the real robot is connected — the serial ports live there.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: roommapper-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      # Subscribe to the broker's own status topic and exit after one message.
      # This proves the broker is actually SERVING, not merely that something
      # holds the port.
      #
      # $$SYS rather than $SYS: compose substitutes single-$ variables in this
      # file before Docker ever sees them, so a lone $SYS would expand to an
      # empty string and the check would subscribe to nothing.
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  influxdb:
    image: influxdb:2.7
    container_name: roommapper-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUX_USER:-admin}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUX_PASSWORD:-roommapper123}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG:-roommapper}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET:-roommapper}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN:-roommapper-super-secret-token}"
      # A student project generates a lot of 10 Hz telemetry; a week is
      # plenty and keeps the volume from growing without bound.
      DOCKER_INFLUXDB_INIT_RETENTION: "${INFLUX_RETENTION:-7d}"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: roommapper-grafana
    ports:
      # Configurable because port 3000 is very often already taken — the
      # SmartClean Twin project runs a Grafana there too.
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Land on the twin dashboard rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/digital-twin.json
      GF_LOG_LEVEL: warn
      # Read by the provisioned datasource, which references them as $VAR
      # rather than hardcoding the token.
      INFLUX_TOKEN: "${INFLUX_TOKEN:-roommapper-super-secret-token}"
      INFLUX_ORG: "${INFLUX_ORG:-roommapper}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-roommapper}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  mapper:
    build:
      context: .
      dockerfile: services/mapper/Dockerfile
    container_name: roommapper-mapper
    ports:
      - "8080:8080"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      ROBOT_ID: "${ROBOT_ID:-MR3W01}"
      REFERENCE_ROOM: "${REFERENCE_ROOM:-rectangular}"
      SCAN_DIR: /data/scans
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Written where the HOST can read it — see the volume below.
      POSE_FILE_PATH: /data/run/roommapper_${ROBOT_ID:-MR3W01}_pose.json
    volumes:
      # Saved scans live on the HOST, not in the container. Without this a
      # `docker compose up --build` silently destroys every measurement the
      # user has taken — which would defeat the point of saving them at all.
      # A bind mount rather than a named volume so the files are visible,
      # copyable and backed up like any other document.
      - ./scans:/data/scans
      # The live pose, for the Omniverse scene.
      #
      # It defaults to the system temp directory, which inside a container is
      # the CONTAINER's temp directory — invisible to anything on the host.
      # The measured room reaches Omniverse over HTTP and crosses that boundary
      # fine; the pose went to a file and did not, so the 3D scene silently
      # fell back to its scripted demo lap and showed a robot that was not the
      # real one. Exactly the failure the twin exists to avoid.
      - ./run:/data/run
    # Simulator by default so the stack is demonstrable with no hardware.
    # Override with: SOURCE=mqtt docker compose up
    command: >
      python services/mapper/main.py
      --source ${SOURCE:-sim}
      --room ${REFERENCE_ROOM:-rectangular}
      --speed ${SIM_SPEED:-4}
      --port 8080
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  telemetry-sink:
    build:
      context: .
      dockerfile: services/telemetry-sink/Dockerfile
    container_name: roommapper-sink
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      INFLUX_URL: http://influxdb:8086
      # Must match the token InfluxDB was initialised with, above.
      INFLUX_TOKEN: "${INFLUX_TOKEN:-roommapper-super-secret-token}"
      INFLUX_ORG: "${INFLUX_ORG:-roommapper}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-roommapper}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
