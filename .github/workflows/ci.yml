name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (the code uses `X | None` and datetime.UTC);
        # 3.12 is what the Docker images run.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        # No hardware, no broker, no Isaac Sim needed — that is deliberate,
        # and it is why CI can verify the whole movement and mapping stack.
        run: pytest tests/ -q --tb=short

      - name: Coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/ --cov=shared --cov=services --cov=simulator \
                 --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  accuracy:
    name: Mapping accuracy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify the robot still measures rooms correctly
        # Separated from the main test job so a regression in mapping ACCURACY
        # is distinguishable at a glance from an ordinary test failure. This is
        # the project's headline claim, so it gets its own red or green tick.
        run: |
          pytest tests/test_integration.py tests/test_comparison.py -q --tb=short

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build mapper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mapper/Dockerfile
          push: false
          load: true
          tags: roommapper/mapper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build telemetry-sink image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/telemetry-sink/Dockerfile
          push: false
          load: true
          tags: roommapper/telemetry-sink:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the mapper image
        # Proves the image actually runs and maps a room, not merely that it
        # built. A container that builds and then crashes on startup is the
        # failure this catches.
        #
        # There is deliberately no MQTT broker here: the map must serve
        # without one. An earlier version connected to MQTT on the startup
        # path, which blocked for up to 210 seconds with no broker listening
        # and made this step fail — so running it broker-less is the
        # regression test for that.
        run: |
          set -euo pipefail

          docker run --rm -d --name mapper-smoke -p 8080:8080 \
            roommapper/mapper:ci \
            python services/mapper/main.py --source sim --speed 25 --port 8080

          echo "--- waiting for the service ---"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "healthy after ~$((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "service never became healthy"
              docker logs mapper-smoke
              docker stop mapper-smoke || true
              exit 1
            fi
            sleep 2
          done

          curl -sf http://localhost:8080/health | tee /dev/stderr | grep -q healthy

          echo "--- waiting for a completed circuit ---"
          # /api/room returns 404 until the robot has mapped something, and
          # `curl -f` treats 404 as an error — so poll for the 200 rather
          # than sleeping a fixed time and hoping.
          for i in $(seq 1 45); do
            code=$(curl -s -o /tmp/room.json -w '%{http_code}' http://localhost:8080/api/room)
            if [ "$code" = "200" ]; then
              echo "room measured after ~$((i * 2))s"
              cat /tmp/room.json
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "no room was ever measured (last HTTP $code)"
              docker logs mapper-smoke | tail -40
              docker stop mapper-smoke || true
              exit 1
            fi
            sleep 2
          done

          echo "--- every page must render ---"
          # Kept in step with the routes that exist. /twin and /compare were
          # here long after both were deleted, so this job had been red on
          # every commit for a whole session while the failure it reported was
          # itself the stale thing.
          for path in / /drive /scans; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || { docker stop mapper-smoke || true; exit 1; }
          done

          docker logs mapper-smoke | tail -20
          docker stop mapper-smoke

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
